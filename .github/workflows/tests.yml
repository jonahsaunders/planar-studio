name: Test Planar Studio

on:
  push:
    branches: [experimental]
  pull_request:
    branches: [main, experimental]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install test dependencies
        run: |
          npm ci --ignore-scripts
          python3 -m venv "$RUNNER_TEMP/planar-python"
          "$RUNNER_TEMP/planar-python/bin/python" -m pip install -r requirements.txt
          echo "PYTHON=$RUNNER_TEMP/planar-python/bin/python" >> "$GITHUB_ENV"
      - name: Test the engines and KiCad integration
        run: |
          "$PYTHON" -c "from planar_studio.kicad_link import HAVE_KIPY, KIPY_IMPORT_ERROR; assert HAVE_KIPY, KIPY_IMPORT_ERROR"
          npm test
          node examples/measured-inductor/compare.mjs
          node examples/measured-inductor/resonance.mjs
          node examples/inductor-coupons/generate.mjs --check
      - name: Test workspace interactions
        run: |
          npm run test:dom
          npm run test:creators:dom
          npm run test:design-layout:dom
          npm run test:motor:dom

  live-kicad:
    name: KiCad ${{ matrix.major }} installer
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - major: 9
            image: debian:trixie-slim
          - major: 10
            image: debian:forky-slim
    steps:
      - name: Install KiCad and test dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install --yes --no-install-recommends ca-certificates git kicad python3-venv xvfb xauth
          kicad-cli version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the plugin dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/planar-python"
          "$RUNNER_TEMP/planar-python/bin/python" -m pip install -r requirements.txt
      - name: Build and exercise the installer with PCB Editor
        env:
          KICAD_MAJOR: ${{ matrix.major }}
        run: |
          python3 scripts/build_package.py --output dist/planar-studio-experimental.zip
          xvfb-run -a "$RUNNER_TEMP/planar-python/bin/python" tests/live-kicad.py dist/planar-studio-experimental.zip --major "$KICAD_MAJOR"
          cp examples/inductor-coupons/inductor-coupons.kicad_pcb "$RUNNER_TEMP/"
          kicad-cli pcb drc --severity-error --exit-code-violations --output "$RUNNER_TEMP/coupon-drc.rpt" "$RUNNER_TEMP/inductor-coupons.kicad_pcb" || { cat "$RUNNER_TEMP/coupon-drc.rpt"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: planar-studio-kicad-${{ matrix.major }}-${{ github.sha }}
          path: dist/planar-studio-experimental.zip
          if-no-files-found: error
