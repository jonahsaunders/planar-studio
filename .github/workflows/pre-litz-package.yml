name: Download Planar Studio 1.3.0 before PCB Litz

on:
  push:
    branches: [build/pre-litz-1.3.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact pre-Litz version
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 695d144fcc18caf3112b76c10866c3ecbce3076d
      - name: Build the KiCad installer
        run: ./build.sh
      - name: Verify package contents against the pre-Litz source
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from zipfile import ZipFile

          with ZipFile('dist/planar-studio-1.3.0.zip') as archive:
              assert archive.testzip() is None, 'Damaged ZIP'
              names = archive.namelist()
              assert 'metadata.json' in names, 'PCM metadata must be at the ZIP root'
              assert 'plugins/plugin.json' in names, 'Missing IPC manifest'
              assert not any('litz' in name.lower() for name in names), 'Unexpected Litz files'
              metadata = json.loads(archive.read('metadata.json'))
              manifest = json.loads(archive.read('plugins/plugin.json'))
              assert metadata['identifier'] == manifest['identifier']
              assert metadata['versions'][0]['version'] == '1.3.0'
              assert metadata['versions'][0]['runtime'] == 'ipc'
              for name in names:
                  if name.endswith('/'):
                      continue
                  source = name.removeprefix('plugins/')
                  expected = subprocess.check_output(['git', 'show', 'HEAD:' + source])
                  assert archive.read(name) == expected, name
          print('Installer verified against the exact pre-Litz source.')
          PY
      # GitHub wraps these contents in a ZIP. Uploading the stage directory
      # places metadata.json at its root, making the download PCM-installable.
      - name: Upload directly installable pre-Litz ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: planar-studio-1.3.0-pre-litz
          path: dist/stage/
          if-no-files-found: error
          retention-days: 90
