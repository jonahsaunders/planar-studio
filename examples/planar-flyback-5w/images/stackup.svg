<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title description">
<title id="title">PS-FLYBACK-5W six-layer reference stack</title>
<desc id="description">Top to bottom: F.Cu 0.035 mm, prepreg 0.203 mm, In1.Cu 0.030 mm, core 0.250 mm, In2.Cu 0.030 mm, prepreg 0.513 mm, In3.Cu 0.030 mm, core 0.250 mm, In4.Cu 0.030 mm, prepreg 0.203 mm, B.Cu 0.035 mm. Total 1.609 mm excluding solder mask. Illustration not to scale; factory construction requires confirmation.</desc>
