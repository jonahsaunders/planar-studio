<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planar Studio</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body data-token="__PLANAR_TOKEN__" data-version="__PLANAR_VERSION__">

<div id="app" data-rail="on" data-side="on">

  <!-- ------------------------------------------------------------ top bar -->
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <path d="M12 3.2a8.8 8.8 0 1 1 0 17.6 7.2 7.2 0 1 0 0-14.4 5.6 5.6 0 1 1 0 11.2 4 4 0 1 0 0-8"
              stroke="var(--copper)"/>
        <circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/>
      </svg>
      <span>Planar Studio<span class="sub" id="version"></span></span>
    </div>

    <nav class="tabs" role="tablist" aria-label="Workspace">
      <button class="tab" role="tab" data-ws="inductor" aria-selected="true">Inductor</button>
      <button class="tab" role="tab" data-ws="motor"    aria-selected="false">PCB motor</button>
      <button class="tab" role="tab" data-ws="filter"   aria-selected="false">Filter</button>
    </nav>

    <input class="namefield" id="design-name" value="L1" spellcheck="false" aria-label="Design name">

    <span class="spacer"></span>

    <button class="link-pill" id="link-pill" data-state="down" title="KiCad connection">
      <span class="dot"></span><span id="link-text">connecting…</span>
    </button>

    <button class="btn" id="btn-tools" title="Optimize, measure, and explore your design">Design tools</button>
    <button class="btn" id="btn-library" title="Write a .kicad_mod into the project library">Library</button>
    <button class="btn" id="btn-export">Export</button>
    <button class="btn primary" id="btn-place" title="Place this design into the open board">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2v9M4.5 7.5 8 11l3.5-3.5M2.5 13.5h11"/></svg>
      Place
    </button>
    <button class="btn ghost" id="btn-theme" title="Toggle theme" aria-label="Toggle theme">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3.2"/><path d="M8 1v1.6M8 13.4V15M15 8h-1.6M2.6 8H1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1M12.9 12.9l-1.1-1.1M4.2 4.2 3.1 3.1"/></svg>
    </button>
  </header>

  <!-- --------------------------------------------------------------- rail -->
  <aside class="rail" id="rail" aria-label="Parameters"></aside>

  <!-- -------------------------------------------------------------- stage -->
  <main class="stage" id="stage">
    <div class="busy" id="busy" hidden></div>
    <canvas id="view"></canvas>

    <div class="stage-tools">
      <div class="toolgroup">
        <button class="btn small" id="t-fit" title="Fit to view (F)">Fit</button>
        <button class="btn small" id="t-zoomin" title="Zoom in">+</button>
        <button class="btn small" id="t-zoomout" title="Zoom out">−</button>
      </div>
      <div class="toolgroup">
        <button class="btn small" id="t-grid" aria-pressed="true" title="Grid (G)">Grid</button>
        <button class="btn small" id="t-vias" aria-pressed="true" title="Vias">Vias</button>
        <button class="btn small" id="t-labels" aria-pressed="false" title="Silkscreen labels">Labels</button>
        <button class="btn small" id="t-handles" aria-pressed="true" title="Drag handles (H)">Handles</button>
      </div>
      <div class="toolgroup">
        <button class="btn small" id="t-rail" title="Hide parameters">‹</button>
        <button class="btn small" id="t-side" title="Hide analysis">›</button>
      </div>
    </div>

    <div class="layer-chips" id="layer-chips"></div>
    <div class="readout" id="readout">—</div>
  </main>

  <!-- --------------------------------------------------------------- side -->
  <aside class="side" id="side" aria-label="Analysis"></aside>

  <!-- ------------------------------------------------------------- status -->
  <footer class="statusbar">
    <span id="st-algo">—</span>
    <span class="sep"></span>
    <span id="st-size">—</span>
    <span class="sep"></span>
    <span id="st-segments">—</span>
    <span class="grow"></span>
    <span id="st-solve">—</span>
    <span class="sep"></span>
    <span id="st-board">no board</span>
  </footer>
</div>

<div class="toasts" id="toasts"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
